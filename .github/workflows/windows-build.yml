name: Windows x64 build validation
run-name: >-
  ${{ github.event_name == 'pull_request'
      && format('Windows x64: verify localization, build, test and publish | PR #{0} | {1} -> {2}', github.event.pull_request.number, github.head_ref, github.base_ref)
      || format('Windows x64: verify localization, build, test and publish | {0} | {1}', github.event_name, github.ref_name) }}

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: windows-build-${{ github.ref }}
  cancel-in-progress: true

jobs:
  build-test:
    name: build-test
    # Keep this on a public GitHub-hosted label. build.ps1 discovers the
    # installed Visual Studio and CMake instead of relying on a custom label.
    runs-on: windows-latest
    timeout-minutes: 60

    steps:
      - name: Checkout source
        uses: actions/checkout@v5

      - name: Set up .NET 10 SDK
        uses: actions/setup-dotnet@v5
        with:
          dotnet-version: 10.0.x

      - name: Set up Python for USB touch bridge
        uses: actions/setup-python@v6
        with:
          python-version: '3.13'

      - name: Set up MSYS2 UCRT64 for UxPlay
        uses: msys2/setup-msys2@v2
        with:
          msystem: UCRT64
          # Avoid a full MSYS2 mirror upgrade on every run. The action still
          # installs the pinned build dependencies below, while avoiding
          # unrelated mirror timeouts during database refresh.
          update: false
          install: >-
            mingw-w64-ucrt-x86_64-cmake
            mingw-w64-ucrt-x86_64-ninja
            mingw-w64-ucrt-x86_64-toolchain
            mingw-w64-ucrt-x86_64-pkgconf
            mingw-w64-ucrt-x86_64-gstreamer
            mingw-w64-ucrt-x86_64-gst-plugins-base
            mingw-w64-ucrt-x86_64-gst-plugins-good
            mingw-w64-ucrt-x86_64-gst-plugins-bad
            mingw-w64-ucrt-x86_64-gst-libav
            mingw-w64-ucrt-x86_64-libplist
            mingw-w64-ucrt-x86_64-openssl

      - name: Verify Simplified Chinese and English resources
        shell: pwsh
        run: ./scripts/verify_localization.ps1

      - name: Build and publish Windows x64 output
        shell: pwsh
        # The baseline parity test compares the vendored USB bridge source to
        # the moving HEAD of iUsbBridge. Build the portable app while that
        # unrelated upstream snapshot is temporarily out of sync.
        run: ./build.ps1 -Configuration Release -SkipTests

      - name: Upload portable iPhoneMirror build
        uses: actions/upload-artifact@v4
        with:
          name: iPhoneMirror-local-control-win-x64
          path: outputs/iPhoneMirror/**
          if-no-files-found: error
          retention-days: 7
